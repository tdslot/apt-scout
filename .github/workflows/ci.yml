name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status checks (see ruleset): check, deny, musl-build, docs-and-conventions, pr-title.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  musl:
    name: musl-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Binary has no dynamic dependencies
        run: |
          bin=target/x86_64-unknown-linux-musl/release/apt-scout
          file "$bin"
          if readelf -d "$bin" 2>/dev/null | rg -q NEEDED; then
            echo "$bin links shared libraries; it must be fully static." >&2
            readelf -d "$bin" >&2
            exit 1
          fi

  docs:
    name: docs-and-conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Non-English text guard (project text must be English)
        run: |
          # Lithuanian letters as Unicode escapes so this file does not match itself.
          # rg exit codes: 0 = match (fail), 1 = no match (pass), 2 = error (fail).
          rc=0
          rg -n --hidden --glob '!.git' --glob '*.{md,rs,toml,yml}' '[\x{0104}\x{0105}\x{010C}\x{010D}\x{0116}-\x{0119}\x{012E}\x{012F}\x{0160}\x{0161}\x{016A}\x{016B}\x{0172}\x{0173}\x{017D}\x{017E}]' . || rc=$?
          if [ "$rc" -eq 1 ]; then exit 0; fi
          [ "$rc" -eq 0 ] && echo "Found Lithuanian characters. All project artifacts must be English only (see AGENTS.md)." >&2
          exit 1
