name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the workflow running so required statuses are reported even for docs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Rust and build configuration changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import PurePosixPath

          # Manual runs and initial pushes run full CI.
          base = os.environ.get('BASE', '')
          code = True
          if os.environ['EVENT'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  base, os.environ['HEAD'], '--',
              ]).decode().split('\0')
              build_files = {
                  'Cargo.toml', 'Cargo.lock', 'rust-toolchain',
                  'rust-toolchain.toml', 'rustfmt.toml', '.rustfmt.toml',
                  'clippy.toml', '.clippy.toml', 'deny.toml',
              }
              code = any(
                  path and (
                      PurePosixPath(path).suffix == '.rs'
                      or PurePosixPath(path).name in build_files
                      or path.startswith(('.cargo/', '.github/workflows/', '.github/scripts/'))
                  ) for path in paths
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'code={str(code).lower()}\n')
          print('Full CI required.' if code else 'No Rust or build configuration changes: builds skipped.')

  check:
    name: check
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  deny:
    name: deny
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  musl:
    name: musl-build
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build using the prebuilt musl container
        run: cross build --release --locked --target x86_64-unknown-linux-musl
      - name: Binary has no dynamic dependencies
        run: |
          bin=target/x86_64-unknown-linux-musl/release/apt-scout
          file "$bin"
          if readelf -d "$bin" 2>/dev/null | rg -q NEEDED; then
            echo "$bin links shared libraries; it must be fully static." >&2
            readelf -d "$bin" >&2
            exit 1
          fi

  docker-test:
    name: docker-test
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests in real Ubuntu images
        run: bash scripts/docker-test.sh

  docs:
    name: docs-and-conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Non-English text guard (project text must be English)
        run: |
          # Lithuanian letters as Unicode escapes so this file does not match itself.
          # rg exit codes: 0 = match (fail), 1 = no match (pass), 2 = error (fail).
          rc=0
          rg -n --hidden --glob '!.git' --glob '*.{md,rs,toml,yml}' '[\x{0104}\x{0105}\x{010C}\x{010D}\x{0116}-\x{0119}\x{012E}\x{012F}\x{0160}\x{0161}\x{016A}\x{016B}\x{0172}\x{0173}\x{017D}\x{017E}]' . || rc=$?
          if [ "$rc" -eq 1 ]; then exit 0; fi
          [ "$rc" -eq 0 ] && echo "Found Lithuanian characters. All project artifacts must be English only (see AGENTS.md)." >&2
          exit 1
