name: Release

# Runs when develop is merged into main. Releases only if Cargo.toml version has no tag yet.
#
# Also dispatchable by hand, which builds and verifies every artifact and stops before publishing.
# The write token lives in the publish job alone, and that job runs inside the `release` environment,
# whose deployment rule admits `main` only. A dispatch on a branch executes that branch's copy of this
# file, so the file itself is not the control: the environment is. Without it, editing this job in a
# branch and dispatching there would still reach a token that creates tags.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify the artifacts, then stop without publishing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      # Tags are needed twice here: the tag-exists check reads them, and the release notes name the
      # previous release for their compare link. A default checkout is shallow and tagless, so
      # `git tag -l` returns nothing in CI and the compare line silently disappears.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          version="$(sed -n -E '0,/^version = "(.*)"/s//\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A dry run always builds: its purpose is to exercise the pipeline for a version that may
          # or may not be tagged yet, so the tag check applies to a push to main only.
          if [ "${{ github.event_name }}" = "push" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.skip != 'true'
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.skip != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tool: cross
      - name: Build and package
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cargo test --locked
          cross build --release --locked --target "$TARGET"
          name="apt-scout-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/apt-scout" LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cp man/apt-scout.1 "dist/$name/"
          # The tarball carries the same documents the .deb does: the binary, both licences, the
          # README with its install steps, and the manual page SPEC.md:196 requires to be in it.
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          # One builder. scripts/build-deb.sh stages the binary, the README, the man page, a
          # copyright carrying the MIT text and a generated changelog.gz, and asserts the archive
          # carries them: the package published here is the package the repository tests.
          bash scripts/build-deb.sh --binary "target/$TARGET/release/apt-scout" "$VERSION"
          (cd dist && sha256sum -- *.tar.gz *.deb > ../SHA256SUMS && mv ../SHA256SUMS .)
          # Release notes are the front page for somebody deciding whether to install this, so they
          # carry more than the changelog section: what it is, how to install either artifact, how to
          # verify them, what it needs, and where the documentation is. The generated section is the
          # "What is new" part and nothing else is hand-written per release.
          awk -v v="## $VERSION " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/section.md
          prev=$(git tag -l 'v*' --sort=-v:refname | sed -n 1p)
          {
            echo "**apt-scout** finds a fresh, fast Ubuntu archive mirror and either recommends it or rewrites your apt sources to use it. One static binary, no runtime, no Python."
            echo
            echo '```sh'
            echo "sudo apt install ./apt-scout_${VERSION}_amd64.deb    # gpgv and ubuntu-keyring come with it"
            echo "sudo apt-scout --country LT                     # asks once, backs up, rewrites, says what changed"
            echo "sudo apt-scout --restore                        # puts the newest backup back"
            echo '```'
            echo
            echo '### What is new'
            echo
            cat /tmp/section.md
            echo '### Install'
            echo
            echo 'Debian package (amd64, static, no libc6 dependency):'
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/apt-scout_${VERSION}_amd64.deb"
            echo "sudo apt install ./apt-scout_${VERSION}_amd64.deb"
            echo '```'
            echo
            echo 'Tarball (binary, both licences, README and the manual page):'
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/apt-scout-v${VERSION}-${TARGET}.tar.gz"
            echo "tar -xzf apt-scout-v${VERSION}-${TARGET}.tar.gz"
            echo "sudo install -m 0755 apt-scout-v${VERSION}-${TARGET}/apt-scout /usr/local/bin/"
            echo "sudo install -m 0644 apt-scout-v${VERSION}-${TARGET}/apt-scout.1 /usr/share/man/man1/"
            echo 'sudo apt install gpgv ubuntu-keyring'
            echo '```'
            echo
            echo '### Verify'
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHA256SUMS"
            echo 'sha256sum -c --ignore-missing SHA256SUMS'
            echo '```'
            echo
            echo '### Requirements and safety'
            echo
            echo '- Ubuntu or a derivative (Pop!_OS, Mint); Debian is refused rather than guessed.'
            echo '- Root only for the write, and for reading a backup to restore. A non-root run prints the `sudo` line and exits 3.'
            echo '- Every replaced file is copied to `/var/backups/apt-scout/<id>/` (0700, root-owned) with a `MANIFEST` before the first byte is written; the write is atomic per file.'
            echo '- Only official archive URIs are rewritten: `security.ubuntu.com`, PPAs, third-party repositories, `ports.ubuntu.com` and `mirror://` are never touched.'
            echo '- `gpgv` with the Ubuntu archive keyring verifies each `InRelease`, and only a verified mirror can be written.'
            echo
            echo '### Documentation'
            echo
            echo '- `man apt-scout` — every flag, mode, exit code and file it touches; also inside the `.deb`.'
            echo "- [README](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/README.md) and [SPEC.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/SPEC.md)."
            if [ -n "$prev" ]; then
              echo "- Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...v${VERSION}"
            fi
          } > notes.md
          echo "--- artifacts ---"
          (cd dist && ls -l && sha256sum --check SHA256SUMS)
          echo "--- archive contents ---"
          dpkg-deb -c dist/*.deb | awk '{print $1, $3, $6}'
          tar -tzf dist/*.tar.gz
      - name: Keep the artifacts
        if: steps.v.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    environment: release
    # The only path to a tag or a release: a push to main, or a dispatch on main with the box
    # unticked. Everything else stops at the build job, which holds no write token.
    if: |
      needs.build.outputs.skip != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.dry_run != true)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # `gh release create --target` resolves the repository from the working tree, so the publish job
      # needs a checkout even though it touches no source file. The first real run failed on exactly
      # that: "failed to run git: fatal: not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          # The upload's root is the least common ancestor of its paths (the repository root, because
          # notes.md sits there), so the artifact carries dist/... and notes.md. Extracting at "." puts
          # them back exactly where the publish steps expect them.
          path: .
      - name: Verify the artifacts before publishing
        run: |
          cd dist
          ls -l
          sha256sum --check SHA256SUMS
          dpkg-deb -c ./*.deb | awk '{print $1, $3, $6}' | grep -q 'usr/share/man/man1/apt-scout.1'
          tar -tzf ./*.tar.gz | grep -q 'apt-scout.1'
      - name: Refuse to republish a tag that exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The build job's tag check is push-only, because a dry run must be able to exercise an
          # already-tagged version. The publish job therefore re-checks: an existing tag means an
          # earlier release owns those bytes, and a second dispatch must not move it.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            exit 0
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.deb dist/SHA256SUMS notes.md \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
