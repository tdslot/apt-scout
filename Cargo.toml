[package]
name = "apt-scout"
version = "0.1.0"
edition = "2024"
description = "Find the fastest, freshest nearby Ubuntu mirror and update apt sources"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdslot/apt-scout"
readme = "README.md"

[dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "tdslot <tdslot@gmail.com>"
depends = ""
section = "admin"
priority = "optional"
assets = [["target/release/apt-scout", "usr/bin/", "755"]]
