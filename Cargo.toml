[package]
name = "apt-scout"
version = "1.0.0"
edition = "2024"
description = "Find the fastest, freshest nearby Ubuntu mirror and update apt sources"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdslot/apt-scout"
readme = "README.md"

[dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "Tadas Lotužas <tdslot@gmail.com>"
depends = "gpgv, ubuntu-keyring"
section = "admin"
priority = "optional"
# The staging layout lives in scripts/build-deb.sh, which is the one builder: the release
# workflow calls it too. This table used to feed cargo-deb, and omitting copyright and
# changelog.gz from it is why the published package differed from the tested one.
